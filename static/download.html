<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06060a">
<title>Unduh</title>
<style>
  :root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;--mono:"SF Mono","Fira Code",monospace;--radius:20px;--radius-sm:13px;--ease:cubic-bezier(.22,1,.36,1);--accent:#0a84ff}
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .35s var(--ease),color .35s var(--ease);-webkit-font-smoothing:antialiased}
  :root{--bg:#06060a;--glass:rgba(255,255,255,.05);--glass-strong:rgba(255,255,255,.09);--border:rgba(255,255,255,.08);--border-hi:rgba(255,255,255,.16);--text:#f5f5f7;--muted:rgba(235,235,245,.52);--shadow:0 24px 70px rgba(0,0,0,.5);--chip:rgba(255,255,255,.06)}
  html[data-theme="light"]{--bg:#f2f2f7;--glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.82);--border:rgba(0,0,0,.08);--border-hi:rgba(0,0,0,.14);--text:#1d1d1f;--muted:rgba(0,0,0,.5);--shadow:0 24px 70px rgba(20,30,60,.14);--chip:rgba(0,0,0,.05);--accent:#0071e3}
  .wrap{width:min(680px,100% - 40px);margin:0 auto;padding:32px 0 60px;flex:1}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--border);transition:all .25s var(--ease)}
  .back:hover{color:var(--text);border-color:var(--border-hi)}
  .back svg{width:15px;height:15px}
  .themeBtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .25s var(--ease)}
  .themeBtn:hover{border-color:var(--border-hi)}
  .card{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .hdr{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--border)}
  .fIcon{width:50px;height:50px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--chip),transparent);border:1px solid var(--border)}
  .fIcon svg{width:25px;height:25px;color:var(--accent)}
  .hdrTxt{min-width:0}
  .hdrTxt h1{font-size:17px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdrTxt .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .prev{min-height:220px;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.35)}
  html[data-theme="light"] .prev{background:rgba(0,0,0,.045)}
  .prev img{max-width:100%;max-height:62vh;border-radius:12px;object-fit:contain}
  .prev video{border-radius:12px}
  .prev audio{width:min(460px,90%)}
  .prev pre{width:100%;max-height:60vh;overflow:auto;background:rgba(0,0,0,.45);color:var(--text);border-radius:12px;padding:18px;font-family:var(--mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  html[data-theme="light"] .prev pre{background:rgba(0,0,0,.06)}
  .prev iframe{width:100%;height:62vh;border:none;border-radius:12px;background:#fff}
  .big{display:grid;place-items:center;gap:12px;color:var(--muted);text-align:center;padding:30px}
  .big svg{width:54px;height:54px;opacity:.5}
  .noPrev{font-size:13px}
  .foot{padding:20px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .sizeInfo{font-size:13px;color:var(--muted)}
  .sizeInfo b{color:var(--text);font-weight:600}
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:168px;padding:13px 26px;border:none;border-radius:15px;background:var(--accent);color:#fff;font-size:15px;font-weight:650;font-family:var(--font);cursor:pointer;transition:transform .15s var(--ease),box-shadow .25s var(--ease),opacity .2s;box-shadow:0 8px 24px -8px var(--accent)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 14px 32px -8px var(--accent)}
  .btn:disabled{opacity:.75;cursor:default;transform:none}
  .btn svg{width:17px;height:17px}
  .count{display:inline-flex;align-items:center;gap:10px}
  .ring{width:24px;height:24px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke:rgba(255,255,255,.35);stroke-width:3}
  .ring circle.prog{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
  .num{font-variant-numeric:tabular-nums;font-weight:700;min-width:14px;text-align:center}
  .cancel{background:transparent;border:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);padding:8px 12px;border-radius:10px;transition:color .2s}
  .cancel:hover{color:var(--text)}
  .hide{display:none!important}
  .err{color:var(--danger);font-size:14px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .pulse{animation:pulse 1s var(--ease) infinite}
  @media(max-width:520px){.wrap{width:100% - 28px;padding:18px 0 40px}.hdr{padding:16px}.foot{padding:16px;justify-content:center;flex-direction:column}.foot .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="/" id="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Beranda
    </a>
    <button class="themeBtn" id="themeBtn" aria-label="Ganti tema">
      <svg id="themeIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <div class="card" id="card">
    <div class="hdr">
      <div class="fIcon" id="fIcon"></div>
      <div class="hdrTxt">
        <h1 id="fname">Memuat…</h1>
        <div class="meta"><span id="fsize">—</span><span class="dot"></span><span class="badge" id="fcat">—</span></div>
      </div>
    </div>
    <div class="prev" id="prev"><div class="noPrev">Memuat pratinjau…</div></div>
    <div class="foot">
      <div class="sizeInfo">Siap diunduh · <b id="freal">—</b></div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn hide" id="dBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Unduh
        </button>
        <button class="cancel hide" id="cancelBtn">Batal</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const ICONS={
    video:'<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><path d="M9.75 15.02l5.75-3.27-5.75-3.27z"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    audio:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/>',
    arch:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
    apk:'<path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M8 9h.01M16 9h.01"/>',
    file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'
  };
  const s=document.createElement('svg');
  function art(path){return '<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'}
  function fmt(n){if(n==null)return'—';const u=['B','KB','MB','GB','TB'];let i=0,v=+n;while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(v>=10||i===0?0:1)+' '+u[i]}
  function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const url=new URLSearchParams(location.search);
  const path=url.get('path')||'';
  const saved=localStorage.getItem('sam_theme');
  document.documentElement.setAttribute('data-theme',saved==='light'?'light':'dark');
  const applyTheme=()=>{const dark=document.documentElement.getAttribute('data-theme')!=='light';const c=$('#themeIcon');if(dark){c.innerHTML='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'}else{c.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>'}document.body.style.background=document.documentElement.getAttribute('data-theme')==='dark'?'#06060a':'#f2f2f7'};
  applyTheme();
  $('#themeBtn').addEventListener('click',()=>{const isDark=document.documentElement.getAttribute('data-theme')!=='light';document.documentElement.setAttribute('data-theme',isDark?'light':'dark');applyTheme();localStorage.setItem('sam_theme',isDark?'light':'dark')});
  $('#back').href='/';
  $('#cancelBtn').addEventListener('click',()=>{stopCount()});

  let timer=null;
  function stopCount(){
    if(timer){clearInterval(timer);timer=null}
    const d=$('#dBtn');d.classList.add('pulse');d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Unduh';d.disabled=false;$('#cancelBtn').classList.add('hide');
  }
  function startCount(dl){
    const d=$('#dBtn');$('#cancelBtn').classList.remove('hide');
    d.disabled=true;d.classList.remove('pulse');
    let t=3;const total=3000;
    d.innerHTML='<span class="count"><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle class="prog" cx="12" cy="12" r="10" stroke-dasharray="62.83" stroke-dashoffset="0"/></svg><span class="num">3</span></span>';
    const ring=d.querySelector('.ring .prog'),num=d.querySelector('.num');
    const startT=Date.now();
    timer=setInterval(()=>{
      const el=Date.now()-startT;
      if(el>=total){stopCount();location.assign(dl);return}
      const sec=Math.ceil((total-el)/1000);num.textContent=sec;
      ring.style.strokeDashoffset=String(62.83*(el/total));
    },100);
  }
  $('#dBtn').addEventListener('click',()=>{if(window.__dl)startCount(window.__dl)});

  (async()=>{
    if(!path){$('#prev').innerHTML='<div class="err">Tidak ada berkas yang dipilih.</div>';return}
    let meta;
    try{
      meta=await(await fetch('/api/file?path='+encodeURIComponent(path))).json();
    }catch(e){$('#prev').innerHTML='<div class="err">Gagal memuat berkas.</div>';return}
    if(!meta||!meta.name){$('#prev').innerHTML='<div class="err">Berkas tidak ditemukan.</div>';return}
    $('#fname').textContent=meta.name;
    $('#freal').textContent=fmt(meta.size);
    $('#fsize').textContent=fmt(meta.size)+' · '+new Date(meta.mtime*1000).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
    $('#fcat').textContent=meta.category;
    const st=meta.category in ICONS?meta.category:'file';
    $('#fIcon').innerHTML=art(ICONS[st]);
    window.__dl=meta.download;
    $('#dBtn').classList.remove('hide');
    const src='/api/stream?path='+encodeURIComponent(meta.path);
    const prev=$('#prev');
    const cat=meta.category,ext=(meta.ext||'').toLowerCase();

    if(cat==='video'&&meta.is_video){
      const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=src;v.style.maxWidth='100%';v.style.maxHeight='62vh';v.style.background='#000';v.style.objectFit='contain';prev.appendChild(v);
    }else if(cat==='image'){
      const im=document.createElement('img');im.src=src;im.alt=meta.name;im.loading='eager';prev.appendChild(im);
    }else if(cat==='audio'){
      const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=src;prev.appendChild(a);
    }else if(cat==='document'){
      if(ext==='.pdf'){const f=document.createElement('iframe');f.src=src;prev.appendChild(f)}
      else if(['.txt','.md','.csv','.log'].includes(ext)){
        try{const tx=await(await fetch(src)).text();const p=document.createElement('pre');p.textContent=tx.slice(0,200000);prev.appendChild(p)}
        catch(e){prev.innerHTML='<div class="noPrev">Pratinjau tidak tersedia.</div>'}
      }else{prev.innerHTML=art(ICONS.doc)+'<div class="noPrev">Pratinjau tidak tersedia untuk berkas ini.</div>'}
    }else{
      prev.innerHTML=art(ICONS[st==='file'?'file':st])+'<div class="noPrev">Pratinjau tidak tersedia — siap diunduh.</div>';
    }
  })();
})();
</script>
</body>
</html>
